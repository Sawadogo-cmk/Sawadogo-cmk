<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-label="Talent Engine — Qualification, scoring et priorisation de candidatures : import de CV PDF, auto-qualification et scoring pondéré configurable.">
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .fu{opacity:0;animation:fu .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

  .arr{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
</style>
<defs>
  <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="236">
    <stop offset="0" stop-color="#70A5FD"/><stop offset=".35" stop-color="#30363d"/><stop offset=".65" stop-color="#30363d"/><stop offset="1" stop-color="#A78BFA"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 600 118" to="360 600 118" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(116 118) scale(320)">
    <stop offset="0" stop-color="#70A5FD" stop-opacity=".18"/><stop offset="1" stop-color="#70A5FD" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fu" style="animation-delay:0s">
  <rect x="1" y="1" width="1198" height="234" rx="22" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="234" rx="22" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="234" rx="22" fill="none" stroke="url(#b)" stroke-width="2"/>

  <circle cx="116" cy="118" r="62" fill="#70A5FD" fill-opacity=".08" stroke="#70A5FD" stroke-opacity=".4"/>
  <circle cx="116" cy="118" r="62" fill="none" stroke="#70A5FD" stroke-width="2">
    <animate attributeName="r" values="62;78" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".5;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(116 118)">
    <g fill="none" stroke="#70A5FD" stroke-width="4">
      <circle r="30" stroke-opacity=".5"/><circle r="19"/><circle r="7" fill="#70A5FD"/>
      <circle r="30" stroke-width="2"><animate attributeName="r" values="7;34" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;0" dur="2s" repeatCount="indefinite"/></circle>
    </g></g>

  <text x="220" y="54" class="mono" font-size="15" letter-spacing="2" fill="#70A5FD">RECRUTEMENT · MOTEUR DE SCORING</text>
  <text x="220" y="96" class="sans" font-size="36" font-weight="800" fill="#e6edf3">Talent Engine</text>
  <text class="sans" font-size="20" fill="#8b949e">
    <tspan x="220" y="132">Qualification, scoring et priorisation de candidatures : import de CV PDF,</tspan><tspan x="220" y="159">auto-qualification et scoring pondéré configurable.</tspan>
  </text>
  <rect x="220" y="176" width="88" height="32" rx="16" fill="#70A5FD" fill-opacity=".1" stroke="#70A5FD" stroke-opacity=".35"/>
    <text x="264" y="197" text-anchor="middle" class="mono" font-size="15" fill="#c9d1d9">Python</text>
    <rect x="318" y="176" width="59" height="32" rx="16" fill="#70A5FD" fill-opacity=".1" stroke="#70A5FD" stroke-opacity=".35"/>
    <text x="347.5" y="197" text-anchor="middle" class="mono" font-size="15" fill="#c9d1d9">PDF</text>
    <rect x="387" y="176" width="98" height="32" rx="16" fill="#70A5FD" fill-opacity=".1" stroke="#70A5FD" stroke-opacity=".35"/>
    <text x="436" y="197" text-anchor="middle" class="mono" font-size="15" fill="#c9d1d9">Scoring</text>

  <g class="arr"><circle cx="1124" cy="118" r="28" fill="#70A5FD" fill-opacity=".12" stroke="#70A5FD" stroke-opacity=".5"/>
    <path d="M1113 118h22m-8-8 8 8-8 8" fill="none" stroke="#70A5FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>
