<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" width="1200" height="514" role="img" aria-label="Terminal : présentation de Noé Sawadogo">
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .fu{opacity:0;animation:fu .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<defs>
  <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
    <stop offset="0.000" stop-color="#70A5FD"/><stop offset="0.333" stop-color="#A78BFA"/><stop offset="0.667" stop-color="#22D3EE"/><stop offset="1.000" stop-color="#70A5FD"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="513" rx="18" fill="#0d1117" stroke="#30363d"/>
<path d="M18 .5h1164a18 18 0 0 1 18 18V50H.5V18.5A18 18 0 0 1 18 .5z" fill="#161b22"/>
<rect x="0" y="50" width="1200" height="1" fill="#30363d"/>
<rect x="1" y="49" width="1198" height="2" fill="url(#top)"/>
<circle cx="30" cy="25" r="7" fill="#ff5f57"/><circle cx="54" cy="25" r="7" fill="#febc2e"/><circle cx="78" cy="25" r="7" fill="#28c840"/>
<text x="600" y="31" text-anchor="middle" class="mono" font-size="16" fill="#8b949e">noe@ouagadougou: ~</text>
<g class="mono" font-size="21" xml:space="preserve">
  <clipPath id="c1"><rect x="44" y="87" width="0" height="31">
    <animate attributeName="width" from="0" to="114" begin="0.50s" dur="0.35s" fill="freeze"/></rect></clipPath>
  <text x="44" y="108" clip-path="url(#c1)"><tspan fill="#3FB950">$</tspan> <tspan fill="#e6edf3">whoami</tspan></text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.20s" dur=".35s" fill="freeze"/>
    <text x="44" y="146"><tspan fill="#e6edf3" font-weight="700">Noé Sawadogo</tspan><tspan fill="#8b949e"> — Ingénieur IA &amp; Développeur Backend</tspan></text></g>
  <clipPath id="c2"><rect x="44" y="175" width="0" height="31">
    <animate attributeName="width" from="0" to="216" begin="1.42s" dur="0.77s" fill="freeze"/></rect></clipPath>
  <text x="44" y="196" clip-path="url(#c2)"><tspan fill="#3FB950">$</tspan> <tspan fill="#e6edf3">cat profil.yml</tspan></text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.54s" dur=".35s" fill="freeze"/>
    <text x="44" y="234"><tspan fill="#70A5FD">formation </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">Licence en Intelligence Artificielle — ADU Niamey</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.76s" dur=".35s" fill="freeze"/>
    <text x="44" y="266"><tspan fill="#70A5FD">poste     </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">Développeur IA / Backend — ERP Cloud SaaS</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.98s" dur=".35s" fill="freeze"/>
    <text x="44" y="298"><tspan fill="#70A5FD">focus     </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">Vision par ordinateur · Deep Learning · APIs REST</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.20s" dur=".35s" fill="freeze"/>
    <text x="44" y="330"><tspan fill="#70A5FD">apprend   </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">MLOps · IA embarquée sur Raspberry Pi</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.42s" dur=".35s" fill="freeze"/>
    <text x="44" y="362"><tspan fill="#70A5FD">cherche   </tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c9d1d9">Stages · collaborations · projets à impact</tspan></text></g>
  <clipPath id="c3"><rect x="44" y="391" width="0" height="31">
    <animate attributeName="width" from="0" to="190" begin="3.64s" dur="0.66s" fill="freeze"/></rect></clipPath>
  <text x="44" y="412" clip-path="url(#c3)"><tspan fill="#3FB950">$</tspan> <tspan fill="#e6edf3">echo $DEVISE</tspan></text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.65s" dur=".35s" fill="freeze"/>
    <text x="44" y="450"><tspan fill="#A78BFA" font-style="italic">« L'IA n'a de valeur que si elle résout de vrais problèmes. »</tspan></text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.87s" dur=".2s" fill="freeze"/>
    <text x="44" y="488" fill="#3FB950">$</text>
    <rect x="69.4" y="470" width="12" height="23" fill="#e6edf3">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect></g>
</g>
</svg>
