<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img" aria-label="HopeVision — Lunettes intelligentes pour personnes malvoyantes : détection d'obstacles, lecture de texte (OCR) et envoi de SMS par commande vocale.">
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .fu{opacity:0;animation:fu .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

  .arr{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
</style>
<defs>
  <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="236">
    <stop offset="0" stop-color="#22D3EE"/><stop offset=".35" stop-color="#30363d"/><stop offset=".65" stop-color="#30363d"/><stop offset="1" stop-color="#A78BFA"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 600 118" to="360 600 118" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(116 118) scale(320)">
    <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fu" style="animation-delay:0s">
  <rect x="1" y="1" width="1198" height="234" rx="22" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="234" rx="22" fill="url(#g)"/>
  <rect x="1" y="1" width="1198" height="234" rx="22" fill="none" stroke="url(#b)" stroke-width="2"/>

  <circle cx="116" cy="118" r="62" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".4"/>
  <circle cx="116" cy="118" r="62" fill="none" stroke="#22D3EE" stroke-width="2">
    <animate attributeName="r" values="62;78" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".5;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(116 118)">
    <g fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-20" cy="4" r="15"/><circle cx="20" cy="4" r="15"/>
      <path d="M-5 0q5-6 10 0M-35 0l-8-12M35 0l8-12"/>
      <line x1="-30" y1="-4" x2="30" y2="-4" stroke-opacity=".9" stroke-width="2">
        <animate attributeName="y1" values="-8;16;-8" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-8;16;-8" dur="2.6s" repeatCount="indefinite"/>
      </line>
    </g></g>

  <text x="220" y="54" class="mono" font-size="15" letter-spacing="2" fill="#22D3EE">PROJET DE FIN D'ÉTUDES · ADU NIAMEY 2026</text>
  <text x="220" y="96" class="sans" font-size="36" font-weight="800" fill="#e6edf3">HopeVision</text>
  <text class="sans" font-size="20" fill="#8b949e">
    <tspan x="220" y="132">Lunettes intelligentes pour personnes malvoyantes : détection d'obstacles,</tspan><tspan x="220" y="159">lecture de texte (OCR) et envoi de SMS par commande vocale.</tspan>
  </text>
  <rect x="220" y="176" width="88" height="32" rx="16" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/>
    <text x="264" y="197" text-anchor="middle" class="mono" font-size="15" fill="#c9d1d9">Python</text>
    <rect x="318" y="176" width="98" height="32" rx="16" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/>
    <text x="367" y="197" text-anchor="middle" class="mono" font-size="15" fill="#c9d1d9">YOLOv8n</text>
    <rect x="426" y="176" width="59" height="32" rx="16" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/>
    <text x="455.5" y="197" text-anchor="middle" class="mono" font-size="15" fill="#c9d1d9">OCR</text>
    <rect x="495" y="176" width="165" height="32" rx="16" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/>
    <text x="577.5" y="197" text-anchor="middle" class="mono" font-size="15" fill="#c9d1d9">Raspberry Pi 4</text>

  <g class="arr"><circle cx="1124" cy="118" r="28" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".5"/>
    <path d="M1113 118h22m-8-8 8 8-8 8" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>
