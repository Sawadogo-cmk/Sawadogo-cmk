<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="CONTRIBUTIONS">
<style>
  .sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .fu{opacity:0;animation:fu .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}

  .ln{stroke-dasharray:170;stroke-dashoffset:170;animation:draw 1.2s .2s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
</style>
<defs>
  
  <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
    <stop offset="0.000" stop-color="#70A5FD"/><stop offset="0.333" stop-color="#A78BFA"/><stop offset="0.667" stop-color="#22D3EE"/><stop offset="1.000" stop-color="#70A5FD"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#70A5FD" stop-opacity="0"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
</defs>
<text x="600" y="28" text-anchor="middle" class="mono fu" font-size="15" fill="#8b949e" letter-spacing="4">05</text>
<text x="600" y="70" text-anchor="middle" class="sans fu" style="animation-delay:.1s" font-size="34" font-weight="800" letter-spacing="4" fill="url(#t)">CONTRIBUTIONS</text>
<line class="ln" x1="395.5" y1="58" x2="225.5" y2="58" stroke="url(#l)" stroke-width="2"/>
<line class="ln" x1="804.5" y1="58" x2="974.5" y2="58" stroke="url(#r)" stroke-width="2"/>
<g fill="#22D3EE">
  <rect x="401.5" y="52" width="10" height="10" transform="rotate(45 406.5 57)"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></rect>
  <rect x="788.5" y="52" width="10" height="10" transform="rotate(45 793.5 57)"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></rect>
</g>
</svg>
